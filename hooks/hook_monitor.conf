[hooks]
# Toggle individual hooks on/off.
# Set to "yes" to monitor, "no" to skip.
# Missing entries default to "yes" (monitor everything).
# Changes take effect immediately — no restart needed.

SessionStart = yes
UserPromptSubmit = yes
PreToolUse = yes
PostToolUse = yes
PostToolUseFailure = yes
PermissionRequest = yes
Notification = yes
SubagentStart = yes
SubagentStop = yes
Stop = yes
TeammateIdle = yes
TaskCompleted = yes
ConfigChange = no
PreCompact = yes
SessionEnd = yes

[sink]
# Forward events to an external companion program (e.g., hooks-store).
# Set to "yes" to enable, "no" to disable.
# The monitor works identically either way — forwarding is fire-and-forget.
forward = no
endpoint = http://localhost:9800/ingest
