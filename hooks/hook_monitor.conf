[hooks]
# Toggle individual hooks on/off.
# Set to "yes" to monitor, "no" to skip.
# Missing entries default to "yes" (monitor everything).
# Changes take effect immediately — no restart needed.

SessionStart = no
UserPromptSubmit = no
PreToolUse = yes
PostToolUse = no
PostToolUseFailure = no
PermissionRequest = no
Notification = no
SubagentStart = no
SubagentStop = no
Stop = no
TeammateIdle = no
TaskCompleted = no
ConfigChange = no
PreCompact = no
SessionEnd = no
